<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GABR Mobile RAG v2</title><style>body{margin:0;background:#0b1020;color:#edf3ff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#121a2f;border:1px solid #263454;border-radius:16px;padding:14px;margin:12px 0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#172445;border:1px solid #314a78;margin-left:6px}.muted{color:#aebbd4}.msg{padding:11px 13px;border-radius:13px;margin:8px 0;white-space:pre-wrap;line-height:1.65}.user{background:#173258}.ai{background:#172235;border:1px solid #293854}.sys{background:#251d36}.controls,.send{display:grid;gap:9px}select,button,textarea{font:inherit;border-radius:12px;border:1px solid #344465;background:#0d1528;color:#eef4ff;padding:11px}button{background:#1d5cff;border-color:#3d74ff;font-weight:700}button:disabled{opacity:.55}textarea{min-height:76px;resize:vertical}.barbox{height:8px;background:#09101f;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#4385ff,#8a5cff)}#chat{max-height:52vh;overflow:auto}</style></head><body><div class="wrap"><div class="card"><h2 style="margin-top:0">GABR AI — Mobile RAG v2</h2><div class="muted">نموذج صغير + Routing معرفي صارم. لا نعتمد على ذاكرة النموذج وحدها.</div><p><span class="badge" id="status">غير محمّل</span><span class="badge" id="route">CORE</span></p><div class="controls"><select id="model"></select><button id="load">تحميل النموذج</button><div class="barbox"><div id="bar" class="bar"></div></div><div id="detail" class="muted">سيتم اختيار نموذج خفيف تلقائيًا.</div></div></div><div class="card"><div id="chat"><div class="msg sys">اختبار استرجاع موجّه: عند أسئلة الحقيقة/الاستنتاج أو الانعكاس الموجّه، تُحقن بطاقة معرفة قصيرة وملزمة قبل الإجابة.</div></div><div class="send"><textarea id="input" placeholder="اكتب سؤالك..."></textarea><button id="send" disabled>إرسال</button></div></div></div><script type="module">import * as webllm from 'https://esm.run/@mlc-ai/web-llm';const $=id=>document.getElementById(id);let engine=null,history=[];const CORE=`You are GABR AI mobile test. Be concise and precise. Respond in the user's language. Never invent sources, tool use, memory, measurements, execution, or certainty. If a KNOWLEDGE CARD is supplied, treat it as the authoritative task reference for this answer and do not replace its definitions with your prior training. Distinguish FACT, INFERENCE, ASSUMPTION, HYPOTHESIS, UNKNOWN when relevant.`;const cards={epistemic:`KNOWLEDGE CARD — EPISTEMIC DEFINITIONS\nFACT: a claim/observation about reality that is directly observed or adequately supported and can in principle be checked.\nINFERENCE: a conclusion drawn from one or more facts/evidence items; it can be correct or wrong.\nASSUMPTION: something temporarily accepted without sufficient verification.\nHYPOTHESIS: a provisional, testable explanation.\nUNKNOWN: evidence is insufficient.\nRequired correction: NEVER define fact as advice/rules and NEVER define inference as feelings/opinions. If asked for the difference, answer with these definitions and one simple example.`,reflection:`KNOWLEDGE CARD — DIRECTED REFLECTION PATTERN\nStatus: user-supplied conceptual model; treat as a hypothesis/model, not established scientific fact unless separately verified.\nDefinition: a counterpart adapts its responses to resemble a transformed echo of the observer's own behavior, causing the observer to analyze an echo of themselves rather than an independent pattern.\nPossible signs: close style tracking with small directional changes; analysis becomes circular/self-referential; the observer's reactions become the object of analysis.\nDefensive handling: 1) recognize possible reflection loop; 2) separate source behavior from echoed behavior; 3) use a safe pattern break, direct reset, or meta-reflection analysis; 4) anchor to an external reference such as verified facts, timestamps, baseline behavior, or independent measurement; 5) test alternative explanations such as coincidence, normal conversational alignment, shared constraints, or common-cause effects.\nDo not claim intent from mirroring alone.\nHybrid tri-phasic threat-model: strategic directness -> gradual masking -> directed reflection. Require evidence for stage transitions before claiming it occurred.`,amdp:`KNOWLEDGE CARD — AMDP DEFENSIVE CONCEPT\nAMDP is a conceptual defensive architecture combining telemetry/sensors, ingestion/normalization, local behavioral baselines, federated anomaly detection, central meta-pattern analysis, moving-target defense, deception/honeypots, adversarial-aware ML, and human-in-the-loop review. Evaluate with MTTD, FPR, TPR, adaptation latency, adversarial resilience, cost, and legal/operational constraints. Keep cybersecurity guidance defensive, high-level, and authorized.`};function route(q){const s=q.toLowerCase();if(/حقيق|استنتاج|fact|inference/.test(s))return['EPISTEMIC',cards.epistemic];if(/انعكاس|مرآة|reflection|mirror|تمويه|نمط هجين/.test(s))return['META-REFLECTION',cards.reflection];if(/amdp|moving target|mtd|honeypot|federated|دفاع تكيف|أمن سيبراني/.test(s))return['AMDP',cards.amdp];return['CORE','']}function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function score(id){const m=(id||'').match(/([0-9.]+)B/i);return m?Number(m[1]):999}const all=(webllm.prebuiltAppConfig?.model_list||[]).filter(x=>/Instruct/i.test(x.model_id||''));all.sort((a,b)=>score(a.model_id)-score(b.model_id));for(const x of all.slice(0,8)){const o=document.createElement('option');o.value=x.model_id;o.textContent=x.model_id;$('model').appendChild(o)}const qi=[...$('model').options].findIndex(o=>/Qwen2\.5-0\.5B/i.test(o.value));if(qi>=0)$('model').selectedIndex=qi;$('load').onclick=async()=>{try{if(!navigator.gpu)throw new Error('WebGPU غير متاح');$('load').disabled=true;$('status').textContent='جاري التحميل';engine=await webllm.CreateMLCEngine($('model').value,{initProgressCallback:p=>{const n=Math.round((p.progress||0)*100);$('bar').style.width=n+'%';$('detail').textContent=p.text||('تحميل '+n+'%')}});$('status').textContent='جاهز';$('detail').textContent='تم التحميل. أعد نفس اختباراتك السابقة.';$('send').disabled=false;$('input').focus()}catch(e){$('status').textContent='فشل';$('detail').textContent=(e&&e.message)?e.message:String(e);$('load').disabled=false}};$('send').onclick=async()=>{const q=$('input').value.trim();if(!q||!engine)return;$('input').value='';add(q,'user');$('send').disabled=true;$('status').textContent='يفكر';const [name,card]=route(q);$('route').textContent=name;const out=add('','ai');let text='';try{const sys=CORE+(card?'\n\n'+card:'');const stream=await engine.chat.completions.create({messages:[{role:'system',content:sys},...history.slice(-2),{role:'user',content:q}],temperature:.05,max_tokens:220,stream:true});for await(const chunk of stream){const piece=chunk.choices?.[0]?.delta?.content||'';if(piece){text+=piece;out.textContent=text;$('chat').scrollTop=$('chat').scrollHeight}}history.push({role:'user',content:q},{role:'assistant',content:text});if(history.length>4)history=history.slice(-4)}catch(e){out.textContent='خطأ: '+((e&&e.message)?e.message:String(e))}finally{$('status').textContent='جاهز';$('send').disabled=false}};$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});</script></body></html>
