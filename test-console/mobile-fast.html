<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GABR Mobile Fast Test</title><style>body{margin:0;background:#0b1020;color:#edf3ff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#121a2f;border:1px solid #263454;border-radius:16px;padding:14px;margin:12px 0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#172445;border:1px solid #314a78}.muted{color:#aebbd4}.warn{background:#332611;color:#ffe3a3}.msg{padding:11px 13px;border-radius:13px;margin:8px 0;white-space:pre-wrap;line-height:1.65}.user{background:#173258}.ai{background:#172235;border:1px solid #293854}.sys{background:#251d36}.controls{display:grid;gap:9px}.send{display:grid;gap:9px}select,button,textarea{font:inherit;border-radius:12px;border:1px solid #344465;background:#0d1528;color:#eef4ff;padding:11px}button{background:#1d5cff;border-color:#3d74ff;font-weight:700}button:disabled{opacity:.55}textarea{min-height:72px;resize:vertical}.barbox{height:8px;background:#09101f;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#4385ff,#8a5cff)}#chat{max-height:50vh;overflow:auto}</style></head><body><div class="wrap"><div class="card"><h2 style="margin-top:0">GABR AI — Mobile Fast Test</h2><div class="muted">نسخة أسرع للهاتف: نموذج صغير + إجابة Streaming + سياق قصير.</div><p><span class="badge" id="status">غير محمّل</span></p><div class="controls"><select id="model"></select><button id="load">تحميل النموذج</button><div class="barbox"><div id="bar" class="bar"></div></div><div id="detail" class="muted">سيتم اختيار أصغر نموذج Instruct متاح تلقائيًا.</div></div></div><div class="card"><div id="chat"><div class="msg sys">هذا اختبار محلي سريع فقط. لا توجد أدوات ويب أو ذاكرة أو Sub-agents حقيقية في هذه الصفحة.</div></div><div class="send"><textarea id="input" placeholder="اكتب سؤالك..."></textarea><button id="send" disabled>إرسال</button></div></div></div><script type="module">import * as webllm from 'https://esm.run/@mlc-ai/web-llm';const $=id=>document.getElementById(id);let engine=null,history=[];const system=`You are GABR AI mobile recovery test. Be concise and rigorous. Separate fact from inference and uncertainty. Do not invent sources, tool use, memory, measurements, execution, or certainty. Challenge assumptions when relevant. Respond in the user's language. In this test you have no web, no external tools, no persistent memory, and no sub-agents.`;function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function score(id){const m=(id||'').match(/([0-9.]+)B/i);return m?Number(m[1]):999}const all=(webllm.prebuiltAppConfig?.model_list||[]).filter(x=>/Instruct/i.test(x.model_id||''));all.sort((a,b)=>score(a.model_id)-score(b.model_id));const use=all.slice(0,8);for(const x of use){const o=document.createElement('option');o.value=x.model_id;o.textContent=x.model_id;$('model').appendChild(o)}const qwen05=[...$('model').options].findIndex(o=>/Qwen2\.5-0\.5B/i.test(o.value));if(qwen05>=0)$('model').selectedIndex=qwen05;$('load').onclick=async()=>{try{if(!navigator.gpu)throw new Error('WebGPU غير متاح');$('load').disabled=true;$('status').textContent='جاري التحميل';engine=await webllm.CreateMLCEngine($('model').value,{initProgressCallback:p=>{const n=Math.round((p.progress||0)*100);$('bar').style.width=n+'%';$('detail').textContent=p.text||('تحميل '+n+'%')}});$('status').textContent='جاهز';$('detail').textContent='تم التحميل. جرّب سؤالًا قصيرًا أولًا.';$('send').disabled=false;$('input').focus()}catch(e){$('status').textContent='فشل';$('detail').textContent=(e&&e.message)?e.message:String(e);$('load').disabled=false}};$('send').onclick=async()=>{const q=$('input').value.trim();if(!q||!engine)return;$('input').value='';add(q,'user');$('send').disabled=true;$('status').textContent='يفكر';const out=add('','ai');let text='';try{const stream=await engine.chat.completions.create({messages:[{role:'system',content:system},...history.slice(-2),{role:'user',content:q}],temperature:.2,max_tokens:160,stream:true});for await(const chunk of stream){const piece=chunk.choices?.[0]?.delta?.content||'';if(piece){text+=piece;out.textContent=text;$('chat').scrollTop=$('chat').scrollHeight}}history.push({role:'user',content:q},{role:'assistant',content:text});if(history.length>4)history=history.slice(-4)}catch(e){out.textContent='خطأ: '+((e&&e.message)?e.message:String(e))}finally{$('status').textContent='جاهز';$('send').disabled=false}};$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});</script></body></html>
